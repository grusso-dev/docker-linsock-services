services:
  php:
    platform: linux/amd64
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: php_app
    restart: unless-stopped
    volumes:
      - ${PHP_APP_PATH_HME}:/var/www/homepage
      - ${PHP_APP_PATH_PRD}:/var/www/lskprd
      - ${PHP_APP_PATH_DEV}:/var/www/lskdev
    expose:
      - 9000
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks:
      - app-network

  nginx:
    image: nginx:stable-alpine3.24
    container_name: nginx_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ${PHP_APP_PATH_HME}:/var/www/homepage:ro
      - ${PHP_APP_PATH_PRD}:/var/www/lskprd:ro
      - ${PHP_APP_PATH_DEV}:/var/www/lskdev:ro
      - ./data/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
