services:
  php-production:
    platform: linux/amd64
    image: dkr-php-debian:${PHP_IMAGE_PRODUCTION_TAG}
    pull_policy: never
    build:
      context: ./php
      dockerfile: Dockerfile.debian
    restart: unless-stopped
    volumes:
      - ${PHP_APP_PATH_PRD}:/var/www/lskprd
    expose:
      - 9000
    healthcheck: &php-healthcheck
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks:
      - production-network

  php-staging:
    platform: linux/amd64
    image: dkr-php-debian:${PHP_IMAGE_STAGING_TAG}
    pull_policy: never
    build:
      context: ./php
      dockerfile: Dockerfile.debian
    restart: unless-stopped
    volumes:
      - ${PHP_APP_PATH_DEV}:/var/www/lskdev
    expose:
      - 9000
    healthcheck: *php-healthcheck
    networks:
      - staging-network

  nginx-production:
    image: nginx:stable-alpine3.24
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ${PHP_APP_PATH_HME}:/var/www/homepage:ro
      - ${PHP_APP_PATH_PRD}:/var/www/lskprd:ro
      - ./data/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php-production:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - production-network

  nginx-staging:
    image: nginx:stable-alpine3.24
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ${PHP_APP_PATH_DEV}:/var/www/lskdev:ro
      - ./data/nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php-staging:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - staging-network

networks:
  production-network:
    driver: bridge
  staging-network:
    driver: bridge
