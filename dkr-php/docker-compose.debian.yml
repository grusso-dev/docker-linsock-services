services:
  php:
    platform: linux/amd64
    build:
      context: ./php
      dockerfile: Dockerfile.debian
    container_name: php_app
    volumes:
      - ${PHP_APP_PATH}:/var/www
    expose:
      - 9000
    networks:
      - app-network

  nginx:
    image: nginx:stable-alpine3.24
    container_name: nginx_web
    ports:
      - "8080:80"
    volumes:
      - ${PHP_APP_PATH}:/var/www:ro
      - ./data/nginx/default.debian.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
