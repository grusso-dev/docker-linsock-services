# Staging: http://HOST:8081/lskdev/
server {
    listen 80 default_server;
    server_name _;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /lskdev/;
    }

    location = /lskdev {
        return 301 /lskdev/;
    }

    # Producción no está disponible desde el puerto de staging.
    location ^~ /lskprd {
        return 404;
    }

    location ^~ /lskdev/uploads/ {
        alias /var/www/lskdev/storage/app/uploads/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        if ($uri ~ "/\.") {
            return 404;
        }

        if ($uri ~* \.(?:php|phtml|phar)(?:/|$)) {
            return 404;
        }
    }

    location /lskdev/ {
        alias /var/www/lskdev/public/;
        index index.php index.html;
        try_files $uri $uri/ /lskdev/index.php?$query_string;

        location ~ /\.(?!well-known(?:/|$)) {
            return 404;
        }

        location ~ ^/lskdev/(.+\.php)$ {
            alias /var/www/lskdev/public/$1;
            fastcgi_pass php-staging:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/lskdev/public/$1;
        }
    }

    # Staging sólo publica su aplicación.
    location / {
        return 404;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }
}
