# Staging: http://HOST:8081/lskdev/
server {
    # Puerto interno del contenedor; Docker lo publica como HOST:8081.
    listen 80 default_server;

    # Acepta cualquier IP o nombre del servidor usado dentro de la red local.
    server_name _;

    # Tamaño máximo del cuerpo HTTP completo, incluidos archivos y campos del formulario.
    # Las peticiones mayores reciben 413 antes de llegar a PHP.
    client_max_body_size 20m;

    # Solicita a buscadores y robots que no indexen el entorno de validación.
    # No constituye autenticación ni control de acceso.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Endpoint liviano utilizado por el healthcheck del contenedor.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # La raíz del puerto de staging redirige a la aplicación de validación.
    location = / {
        return 302 /lskdev/;
    }

    # Normaliza la URL para que las rutas relativas conserven la barra final.
    location = /lskdev {
        return 301 /lskdev/;
    }

    # Producción no está disponible desde el puerto de staging.
    location ^~ /lskprd {
        return 404;
    }

    # Publica los uploads como archivos estáticos y nunca los envía a PHP-FPM.
    location ^~ /lskdev/uploads/ {
        alias /var/www/lskdev/storage/app/uploads/;

        # Impide listar el directorio, evita MIME sniffing y conserva noindex.
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        # Bloquea archivos ocultos y cualquier extensión PHP ejecutable dentro de uploads.
        if ($uri ~ "/\.") {
            return 404;
        }

        if ($uri ~* \.(?:php|phtml|phar)(?:/|$)) {
            return 404;
        }
    }

    # Aplicación de staging. Si no existe un archivo estático, usa index.php
    # como front controller y conserva los parámetros de la petición.
    location /lskdev/ {
        alias /var/www/lskdev/public/;
        index index.php index.html;
        try_files $uri $uri/ /lskdev/index.php?$query_string;

        # Evita publicar .env, .git y otros archivos ocultos de la aplicación.
        location ~ /\.(?!well-known(?:/|$)) {
            return 404;
        }

        # Envía únicamente los scripts PHP de staging a su PHP-FPM aislado.
        location ~ ^/lskdev/(.+\.php)$ {
            alias /var/www/lskdev/public/$1;
            fastcgi_pass php-staging:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/lskdev/public/$1;
        }
    }

    # Staging sólo publica su aplicación.
    location / {
        return 404;
    }

    # No ejecutar PHP fuera de la aplicación de staging.
    location ~ \.php$ {
        return 404;
    }

    # Protección global de archivos ocultos, excepto .well-known.
    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }
}
