server {
    listen 80;
    server_name localhost;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------------------------
    # Página principal en "/"
    # ---------------------------
    location = / {
        index index.html;
        root /var/www/homepage;
    }

    location / {
        try_files $uri $uri/ =404;
        root /var/www/homepage;
    }

    # No ejecutar ni exponer archivos PHP fuera de las aplicaciones.
    location ~ ^/(?!lskdev/|lskprd/).*\.php$ {
        return 404;
    }

    # Bloquear archivos y directorios ocultos, excepto ACME/Let's Encrypt.
    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    # ---------------------------
    # Redirecciones si falta la barra
    # ---------------------------
    location = /lskdev {
        return 301 /lskdev/;
    }

    location = /lskprd {
        return 301 /lskprd/;
    }

    # Uploads DEV: sólo archivos estáticos, nunca PHP-FPM.
    location ^~ /lskdev/uploads/ {
        alias /var/www/lskdev/storage/app/uploads/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;

        if ($uri ~ "/\.") {
            return 404;
        }

        if ($uri ~* \.(?:php|phtml|phar)(?:/|$)) {
            return 404;
        }
    }

    # Uploads PRD: sólo archivos estáticos, nunca PHP-FPM.
    location ^~ /lskprd/uploads/ {
        alias /var/www/lskprd/storage/app/uploads/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;

        if ($uri ~ "/\.") {
            return 404;
        }

        if ($uri ~* \.(?:php|phtml|phar)(?:/|$)) {
            return 404;
        }
    }

    # ---------------------------
    # Aplicación DEV en /lskdev/
    # ---------------------------
    location /lskdev/ {
        alias /var/www/lskdev/public/;
        index index.php index.html;
        try_files $uri $uri/ /lskdev/index.php?$query_string;

        location ~ /\.(?!well-known(?:/|$)) {
            return 404;
        }

        location ~ ^/lskdev/(.+\.php)$ {
            alias /var/www/lskdev/public/$1;
            fastcgi_pass php:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/lskdev/public/$1;
        }
    }

    # ---------------------------
    # Aplicación PRD en /lskprd/
    # ---------------------------
    location /lskprd/ {
        alias /var/www/lskprd/public/;
        index index.php index.html;
        try_files $uri $uri/ /lskprd/index.php?$query_string;

        location ~ /\.(?!well-known(?:/|$)) {
            return 404;
        }

        location ~ ^/lskprd/(.+\.php)$ {
            alias /var/www/lskprd/public/$1;
            fastcgi_pass php:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/lskprd/public/$1;
        }
    }
}
