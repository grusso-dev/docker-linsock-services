# Producción: http://HOST:8080/lskprd/
server {
    # Puerto interno del contenedor; Docker lo publica como HOST:8080.
    listen 80 default_server;

    # Acepta cualquier IP o nombre del servidor usado dentro de la red local.
    server_name _;

    # Tamaño máximo del cuerpo HTTP completo, incluidos archivos y campos del formulario.
    # Las peticiones mayores reciben 413 antes de llegar a PHP.
    client_max_body_size 20m;

    # Endpoint liviano utilizado por el healthcheck del contenedor.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Página principal estática; aquí no se ejecuta PHP.
    location = / {
        index index.html;
        root /var/www/homepage;
    }

    # Normaliza la URL para que las rutas relativas conserven la barra final.
    location = /lskprd {
        return 301 /lskprd/;
    }

    # Staging no está disponible desde el puerto de producción.
    location ^~ /lskdev {
        return 404;
    }

    # Publica los uploads como archivos estáticos y nunca los envía a PHP-FPM.
    location ^~ /lskprd/uploads/ {
        alias /var/www/lskprd/storage/app/uploads/;

        # Impide listar el contenido del directorio y fuerza al navegador a respetar el MIME.
        autoindex off;
        add_header X-Content-Type-Options nosniff always;

        # Bloquea archivos ocultos y cualquier extensión PHP ejecutable dentro de uploads.
        if ($uri ~ "/\.") {
            return 404;
        }

        if ($uri ~* \.(?:php|phtml|phar)(?:/|$)) {
            return 404;
        }
    }

    # Aplicación de producción. Si no existe un archivo estático, usa index.php
    # como front controller y conserva los parámetros de la petición.
    location /lskprd/ {
        alias /var/www/lskprd/public/;
        index index.php index.html;
        try_files $uri $uri/ /lskprd/index.php?$query_string;

        # Evita publicar .env, .git y otros archivos ocultos de la aplicación.
        location ~ /\.(?!well-known(?:/|$)) {
            return 404;
        }

        # Envía únicamente los scripts PHP de producción a su PHP-FPM aislado.
        location ~ ^/lskprd/(.+\.php)$ {
            alias /var/www/lskprd/public/$1;
            fastcgi_pass php-production:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/lskprd/public/$1;
        }
    }

    # Página principal y archivos estáticos fuera de la aplicación.
    location / {
        root /var/www/homepage;
        try_files $uri $uri/ =404;
    }

    # No ejecutar PHP fuera de la aplicación de producción.
    location ~ \.php$ {
        return 404;
    }

    # Protección global de archivos ocultos, excepto .well-known.
    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }
}
